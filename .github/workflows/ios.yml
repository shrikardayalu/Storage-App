name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.simpleshrink.app

jobs:
  core-tests:
    name: StorageCore tests (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Safety check (Photos read-only and only in StorageApp/Photos; no deletion or network)
        run: bash ios/Tools/check-no-device-access.sh
      - name: Run package tests
        working-directory: ios/StorageCore
        run: swift test

  app:
    name: Build, screenshot, and test (iOS Simulator)
    runs-on: macos-15
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime in sorted(devices, reverse=True) if "iOS" in runtime
                    for d in devices[runtime] if d["name"].startswith("iPhone")]
          # Prefer a Pro Max (6.9-inch): its screenshots are the size App Store Connect asks for.
          preferred = [d for d in phones if "Pro Max" in d["name"]]
          print((preferred or phones)[0]["udid"])
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: ios
        run: |
          xcodebuild build-for-testing \
            -project StorageApp.xcodeproj \
            -scheme StorageApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Check the app bundle (privacy manifest, usage strings)
        working-directory: ios
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/StorageApp.app
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy is missing from the app bundle"; exit 1; }
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$APP/Info.plist"
      - name: Take screenshots
        working-directory: ios
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/StorageApp.app
          mkdir -p screenshots
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$APP"
          for appearance in light dark; do
            xcrun simctl ui "$UDID" appearance "$appearance"
            for screen in onboarding reveal paywall home library settings guide whatsapp results; do
              xcrun simctl launch "$UDID" "$BUNDLE_ID" -screenshotScreen "$screen"
              sleep 4
              xcrun simctl io "$UDID" screenshot "screenshots/$screen-$appearance.png"
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            done
          done
          # Large text, to check the fixed-height screens still fit.
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl ui "$UDID" content_size accessibility-large
          for screen in onboarding reveal paywall home; do
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -screenshotScreen "$screen"
            sleep 4
            xcrun simctl io "$UDID" screenshot "screenshots/$screen-largetext.png"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          done
          xcrun simctl ui "$UDID" content_size large
          ls screenshots
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: ios/screenshots
          if-no-files-found: warn
      - name: Run app tests
        working-directory: ios
        run: |
          xcodebuild test-without-building \
            -project StorageApp.xcodeproj \
            -scheme StorageApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: ios/TestResults.xcresult
          if-no-files-found: ignore

  unsigned-ipa:
    name: Unsigned .ipa (for Sideloadly)
    runs-on: macos-15
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for device without signing
        working-directory: ios
        run: |
          xcodebuild build \
            -project StorageApp.xcodeproj \
            -scheme StorageApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StorageApp.app Payload/
          zip -qry StorageApp-unsigned.ipa Payload
          ls -lh StorageApp-unsigned.ipa
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: StorageApp-unsigned-ipa
          path: ios/StorageApp-unsigned.ipa

  testflight:
    name: Release build to TestFlight
    # Manual only: Actions → iOS → Run workflow. Skips until the App Store
    # Connect secrets in docs/RELEASE.md are set.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    needs: [core-tests, app]
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$TEAM_ID" ]; then
            echo "::warning::App Store Connect secrets aren't set; skipping the TestFlight upload. See docs/RELEASE.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - name: Install XcodeGen
        if: steps.secrets.outputs.ready == 'true'
        run: brew install xcodegen
      - name: Generate Xcode project
        if: steps.secrets.outputs.ready == 'true'
        working-directory: ios
        run: xcodegen generate
      - name: Write the App Store Connect API key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
      - name: Archive (Release)
        if: steps.secrets.outputs.ready == 'true'
        working-directory: ios
        run: |
          # Build number: the run number, so every upload is unique.
          xcodebuild archive \
            -project StorageApp.xcodeproj \
            -scheme StorageApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/StorageApp.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        working-directory: ios
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/StorageApp.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
