# XcodeGen spec. Generate the Xcode project on a Mac with:
#   brew install xcodegen
#   cd ios && xcodegen generate
# StorageApp.xcodeproj is generated output and is not committed.

name: StorageApp

options:
  bundleIdPrefix: com.example.storageapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple team ID here, or pick it in Xcode under Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  StorageCore:
    path: StorageCore

targets:
  StorageApp:
    type: application
    platform: iOS
    sources:
      - path: StorageApp
    dependencies:
      - package: StorageCore
    info:
      path: StorageApp/Info.plist
      properties:
        CFBundleDisplayName: SimpleShrink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Test Mode reads one album only (Build Plan step 2). Keep in sync with xtool-Info.plist.
        NSPhotoLibraryUsageDescription: SimpleShrink reads your "Storage App Test" album to show what takes up space. It changes only photos in that album that you approve.
        # The app offers its own "Change Selection" button instead of iOS asking on every launch.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.storageapp
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO

  StorageAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StorageAppTests
      # StoreKit Testing (SKTestSession) reads the same products the app runs with.
      - path: Products.storekit
        buildPhase: resources
    dependencies:
      - target: StorageApp
      - package: StorageCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.storageapp.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  StorageApp:
    build:
      targets:
        StorageApp: all
        StorageAppTests: [test]
    run:
      config: Debug
      # Local App Store for Xcode runs: buy, restore, cancel and refund with no
      # developer account (Debug > StoreKit > Manage Transactions).
      storeKitConfiguration: Products.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - StorageAppTests
    archive:
      config: Release
